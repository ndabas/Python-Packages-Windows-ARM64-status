name: Windows ARM64 Docker smoke test

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

env:
  MOBY_REPO: https://github.com/moby/moby.git
  MOBY_REF: master

jobs:
  docker-smoke-test:
    runs-on: windows-11-vs2026-arm
    steps:
      - name: Show optional Windows features
        shell: pwsh
        run: |
          Get-WindowsOptionalFeature -Online |
            Sort-Object FeatureName |
            Format-Table FeatureName, State -AutoSize | Out-String -Width 200

      - name: Resolve moby commit
        id: moby
        shell: pwsh
        run: |
          $sha = (git ls-remote $env:MOBY_REPO $env:MOBY_REF | Select-Object -First 1).Split()[0]
          if (-not $sha) { throw "Could not resolve $env:MOBY_REF in $env:MOBY_REPO" }
          Write-Host "moby commit: $sha"
          "sha=$sha" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Cache Docker binaries
        id: cache-docker
        uses: actions/cache@v4
        with:
          path: docker-bin
          key: docker-windows-arm64-${{ steps.moby.outputs.sha }}

      - name: Clone moby
        if: steps.cache-docker.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          git config --global core.longpaths true
          git clone --depth 1 --branch $env:MOBY_REF $env:MOBY_REPO moby

      - name: Set up Go
        if: steps.cache-docker.outputs.cache-hit != 'true'
        uses: actions/setup-go@v7
        with:
          go-version-file: moby/go.mod
          cache: false

      - name: Build Docker client and daemon
        if: steps.cache-docker.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          go install github.com/tc-hib/go-winres@latest
          $env:GOPATH = go env GOPATH
          $env:Path += ";$env:GOPATH\bin"
          cd moby
          ./hack/make.ps1 -Client -Daemon
          New-Item -ItemType Directory -Force -Path ..\docker-bin | Out-Null
          Copy-Item bundles\dockerd.exe, bundles\docker.exe ..\docker-bin\

      - name: Start dockerd in background
        id: dockerd
        background: true
        shell: pwsh
        run: |
          & .\docker-bin\dockerd.exe --exec-opt isolation=hyperv

      - name: Wait for dockerd to be ready
        shell: pwsh
        run: |
          $deadline = (Get-Date).AddMinutes(3)
          while ($true) {
            & .\docker-bin\docker.exe version *> $null
            if ($LASTEXITCODE -eq 0) { break }
            if ((Get-Date) -gt $deadline) { throw 'dockerd did not become ready in time' }
            Start-Sleep -Seconds 5
          }
          & .\docker-bin\docker.exe version

      - name: Run smoke test container
        shell: pwsh
        run: |
          & .\docker-bin\docker.exe run --rm mcr.microsoft.com/windows/servercore:ltsc2025-arm64 `
            powershell -Command "Write-Host 'Hello from inside the container'; Write-Host ('Architecture: ' + `$env:PROCESSOR_ARCHITECTURE); [System.Environment]::OSVersion.VersionString"
          if ($LASTEXITCODE -ne 0) { throw "Smoke test failed with exit code $LASTEXITCODE" }

      - name: Stop dockerd
        cancel: dockerd
