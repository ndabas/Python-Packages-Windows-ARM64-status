name: Windows ARM64 Docker smoke test

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  fetch-package-lists:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Generate package lists from the Google Sheet
        env:
          GOOGLE_SHEET_URL: ${{ secrets.GOOGLE_SHEET_URL }}
          GOOGLE_SHEET_NAME: ${{ secrets.GOOGLE_SHEET_NAME }}
          GOOGLE_SHEET_COL_PACKAGE_NAME: ${{ secrets.GOOGLE_SHEET_COL_PACKAGE_NAME }}
          GH_TOKEN: ${{ github.token }}
        run: python scripts/fetch_package_status.py

      - name: Upload package lists
        uses: actions/upload-artifact@v7
        with:
          name: package-lists
          path: data/

  test-package-installs:
    runs-on: windows-11-arm
    needs: fetch-package-lists
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.13', '3.14', '3.15']
        buildtools: [false, true]
    name: test-package-installs (${{ matrix.python-version }}${{ matrix.buildtools && ', buildtools' || '' }})
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Download package lists
        uses: actions/download-artifact@v8
        with:
          name: package-lists
          path: data

      - name: Set up Docker
        if: ${{ !matrix.buildtools }}
        uses: ndabas/setup-moby-windows-arm64@v1

      - name: Build Python image
        if: ${{ !matrix.buildtools }}
        shell: pwsh
        run: |
          docker build -t python-arm64 --build-arg PYTHON_VERSION=${{ matrix.python-version }} .
          if ($LASTEXITCODE -ne 0) { throw "Build failed with exit code $LASTEXITCODE" }

      - name: Smoke test Python image
        if: ${{ !matrix.buildtools }}
        shell: pwsh
        run: |
          docker run --rm python-arm64 cmd /c "python -VV 2>&1 | findstr ARM64"
          if ($LASTEXITCODE -ne 0) { throw "Smoke test failed with exit code $LASTEXITCODE" }

      - name: Set up Python
        if: matrix.buildtools
        id: setup-python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          architecture: arm64

      - name: Set up MSVC developer environment
        if: matrix.buildtools
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: arm64

      - name: Smoke test Python and Build Tools
        if: matrix.buildtools
        shell: pwsh
        run: |
          & '${{ steps.setup-python.outputs.python-path }}' -VV 2>&1 | findstr ARM64
          if ($LASTEXITCODE -ne 0) { throw "Python smoke test failed with exit code $LASTEXITCODE" }
          $cl = (Get-Command cl).Source
          Write-Host $cl
          if ($cl -notmatch '\\HostARM64\\arm64\\') { throw "Expected native ARM64 cl.exe, got $cl" }
          rustc -Vv
          if ($LASTEXITCODE -ne 0) { throw "Rust smoke test failed with exit code $LASTEXITCODE" }

      - name: Test package installs
        shell: pwsh
        run: |
          ./scripts/Test-PackageInstalls.ps1 `
            -ColumnPrefix 'py${{ matrix.python-version }}${{ matrix.buildtools && '_buildtools' || '' }}' `
            ${{ matrix.buildtools && format('-Python ''{0}''', steps.setup-python.outputs.python-path) || '-Image python-arm64 -OnlyBinary' }} `
            -ListPath data\test-win_arm64${{ matrix.buildtools && '-buildtools' || '' }}.txt

      - name: Upload results
        uses: actions/upload-artifact@v7
        with:
          name: results-py${{ matrix.python-version }}${{ matrix.buildtools && '-buildtools' || '' }}
          path: results-*.csv

  consolidate-results:
    runs-on: ubuntu-latest
    needs: test-package-installs
    if: ${{ !cancelled() }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Download result CSVs
        uses: actions/download-artifact@v8
        with:
          pattern: results-*
          path: results
          merge-multiple: true

      - name: Download package lists
        uses: actions/download-artifact@v8
        with:
          name: package-lists
          path: data

      - name: Consolidate CSVs
        run: python scripts/consolidate_results.py --input results

      - name: Upload consolidated CSV
        uses: actions/upload-artifact@v7
        with:
          name: consolidated-results
          path: data/win_arm64-status-*.csv
